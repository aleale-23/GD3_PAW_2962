<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir</title>
    <link rel="stylesheet" href="style.css">
    <a href="profil.html" class="tombol" onclick="return confirm('Apakah Anda yakin ingin kembali ke Profil?')">Kembali ke Profil</a>
    <a href="interaktif.html" class="tombol" onclick="return confirm('Apakah Anda yakin ingin kembali ke Halaman Interaktif?')">Kembali ke Halaman Interaktif</a>
</head>
<body>
    <div class="form-container">
    <h1>Formulir</h1>
    <form action="proses.php" method="post">
        <div class="form-group">
            <label for="nama">Nama:</label>
            <input type="text" name="nama" required>
        </div>
        <div class="form-group">
            <label>Jenis Kelamin:</label>
            <div class="radio-group">
                <input type="radio" value="Laki-laki" name="jenis_kelamin" required> 
                <label for="laki-laki">Laki-laki</label>
                <input type="radio" value="Perempuan" name="jenis_kelamin" required>
                <label for="perempuan">Perempuan</label>
            </div>
        </div>
        <div class="form-group">
            <label for="program_studi">Program Studi:</label>
            <select name="program_studi" id="program_studi" required>
            <option>Teknik Informatika</option>
            <option>Sistem Informasi</option>
            <option>Teknik Industri</option>
        </select>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Masukkan email" required>
        </div>
        <div class="form-group">
            <label for="alasan">Alasan Mendaftar:</label>
            <textarea id="alasan" name="alasan" placeholder="Masukkan alasan mendaftar" required></textarea>
        </div>
        <button type="submit">Daftar</button>
    </form>
    </div>
</body>
</html>
