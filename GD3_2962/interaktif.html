<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Interaktif</title>
    <link rel="stylesheet" href="style.css">
    <a href="profil.html" class="tombol" onclick="return confirm('Apakah Anda yakin ingin kembali ke Profil?')">Kembali ke Profil</a>
    <a href="form.html" class="tombol" onclick="return confirm('Apakah Anda yakin ingin kembali ke Formulir?')">Kembali ke Formulir</a>
</head>
<body>
    <h1 id="judul_halaman">Halaman Interaktif</h1>
    <script>
        const judul = document.getElementById("judul_halaman");
        judul.style.color = "red";
        console.log(judul.innerHTML)
    </script> 
    <script>
        function sapa(nama) {
            return "Hallo " + nama + "!";
        }
        console.log(sapa("Alegra Bone Fasia Samosir"));
    </script> 
    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>
    <script>
        function ubahBiru() {
            const teks = document.getElementById("teks");
            teks.style.color = "blue";
        }
    </script>
    <label id="inputNama">Masukkan Nama:</label>
    <input type="text" id="inputNama">
    <button onclick="tampilkanNama()">Tampilkan Nama</button>
    <script>
        function tampilkanNama() {
            const input = document.getElementById("inputNama").value;
            if(input.trim() === "") {
                alert("Nama tidak boleh kosong!");
            } else {
                alert("Halo, " + input + "!");
            }
        }
    </script>

    <label for="angka">Masukkan angka:</label>
    <input type="number" id="angka">

    <button onclick="hitungKuadrat()">Hitung Kuadrat</button>
    <script>
        function hitungKuadrat() {
            const angka = document.getElementById("angka").value;
            const kuadrat = angka * angka;
            alert("Hasil kuadrat: " + kuadrat);
        }
    </script> 
</body>

</html>
